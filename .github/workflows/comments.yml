name: comments
# Yeni videolara ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py, fenek-de-en'den), saatte bir
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: Marble Rush Arena
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: "Marble Rush Arena"
          CHANNEL_ABOUT: "Physics marble races with country flags and colors. Pick your marble!"
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          REQUESTS_FILE: viewer_requests.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: '["Which marble were you cheering for? 👀", "Did your pick make the top 3? 🏁", "Which country should race next? 🌍", "Rate this track from 1 to 10 🎢", "Which obstacle was the craziest? 🤯", "Did you guess the winner before the finish? 🤔", "What's your lucky marble color? 🎨", "Bumpers or funnels: which part was better? ⚡", "Should the next track be longer? 🛤️", "Comment your country and we'll put it in a race! 🌍", "Who had the worst luck in this race? 😅", "How many times did the lead change for you? 🔄", "Which marble deserved to win? 🏆", "Watch it again: did you spot the big comeback? 👀", "Pick your marble for the next race 👇"]'
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json viewer_requests*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
